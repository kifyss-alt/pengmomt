<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>태블릿 사용 타임아웃 게시판</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&display=swap">
<style>
  :root{
    --primary:#2563eb;
    --primary-dark:#1d4ed8;
    --bg-main:#f3f6fb;
    --bg-card:#ffffff;
    --text-main:#0f172a;
    --text-soft:#64748b;
    --border:#e2e8f0;
    --track:#e6ebf3;
    --red:#ef4444;
    --amber:#f59e0b;
    --radius-lg:20px;
    --radius-md:14px;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--bg-main);
    color:var(--text-main);
    font-family:'Gowun Dodum','Malgun Gothic',sans-serif;
    -webkit-tap-highlight-color:transparent;
    word-break:keep-all;
    -webkit-user-select:none;
    user-select:none;
    display:flex;
    flex-direction:column;
    overflow:hidden;
  }
  h1,h2{
    font-family:'Gowun Batang',serif;
    text-wrap:balance;
  }

  .top-bar{
    flex:0 0 auto;
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    padding:14px clamp(16px,4vw,40px) 10px;
    max-width:1600px;
    width:100%;
    margin:0 auto;
    -webkit-app-region:drag;
  }
  .top-bar button, .top-bar .today-badge{ -webkit-app-region:no-drag; }
  .title-group h1{
    font-size:clamp(1.15rem,2.4vw,1.6rem);
    margin:0 0 4px;
    display:flex; align-items:center; gap:8px;
  }
  .title-group .subtitle{
    margin:0;
    font-size:.86rem;
    color:var(--text-soft);
  }
  .top-bar-right{
    display:flex; align-items:center; gap:8px; flex-wrap:wrap;
  }
  .today-badge{
    background:#fff;
    border:1px solid var(--border);
    border-radius:999px;
    padding:.5rem 1rem;
    font-size:.85rem;
    color:var(--text-soft);
    box-shadow:0 1px 3px rgba(15,23,42,.05);
  }
  .icon-btn{
    border:1px solid var(--border);
    background:#fff;
    border-radius:999px;
    padding:.5rem 1rem;
    font-size:.85rem;
    color:var(--text-main);
    cursor:pointer;
    display:inline-flex; align-items:center; gap:6px;
    transition:background .15s ease, transform .1s ease, border-color .15s ease, color .15s ease;
  }
  .icon-btn:hover{ background:#eff6ff; }
  .icon-btn:active{ transform:scale(.96); }
  .icon-btn.pinned{ background:var(--primary); color:#fff; border-color:var(--primary); }
  .icon-btn[hidden]{ display:none; }

  .period-toggle{
    display:inline-flex;
    background:#fff;
    border:1px solid var(--border);
    border-radius:999px;
    padding:3px;
    gap:2px;
    box-shadow:0 1px 3px rgba(15,23,42,.05);
    -webkit-app-region:no-drag;
  }
  .period-btn{
    border:none;
    background:transparent;
    border-radius:999px;
    padding:.45rem 1.1rem;
    font-size:.85rem;
    font-weight:700;
    color:var(--text-soft);
    cursor:pointer;
    transition:background .15s ease, color .15s ease;
  }
  .period-btn.active{
    background:var(--primary);
    color:#fff;
  }

  .board{
    flex:1 1 auto;
    min-height:0;
    display:grid;
    grid-template-columns:repeat(6, 1fr);
    grid-template-rows:repeat(3, minmax(0,1fr));
    gap:clamp(8px,1.4vh,16px);
    padding:4px clamp(16px,4vw,40px) 10px;
    max-width:1600px;
    width:100%;
    margin:0 auto;
    overflow-y:auto;
    overflow-x:hidden;
  }

  .kid-card{
    background:var(--bg-card);
    border:2px solid var(--border);
    border-radius:var(--radius-lg);
    padding:clamp(8px,1.6vh,16px) 10px clamp(6px,1.2vh,14px);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:space-between;
    gap:clamp(3px,0.8vh,10px);
    min-height:0;
    overflow:hidden;
    transition:border-color .25s ease, background .25s ease, box-shadow .25s ease;
  }
  .kid-card.running{ border-color:var(--red); }
  .kid-card.warn{ border-color:var(--amber); background:#fffbeb; }
  .kid-card.exhausted{ background:#f8fafc; }
  .kid-card.ended{
    border-color:var(--red);
    background:#fef2f2;
    animation:pulseAlert 1.1s ease-in-out infinite;
  }
  @keyframes pulseAlert{
    0%,100%{ box-shadow:0 0 0 0 rgba(239,68,68,.45); }
    50%{ box-shadow:0 0 0 9px rgba(239,68,68,0); }
  }

  .dial-wrap{
    position:relative;
    flex:0 0 auto;
    width:clamp(40px,9vh,90px);
    height:clamp(40px,9vh,90px);
  }
  .dial{
    width:100%; height:100%; border-radius:50%;
    background:conic-gradient(from -90deg, var(--dial-red,var(--red)) 0deg var(--angle,0deg), var(--track) var(--angle,0deg) 360deg);
    box-shadow:inset 0 0 0 5px #fff, 0 1px 4px rgba(15,23,42,.12);
    display:flex; align-items:center; justify-content:center;
  }
  .kid-card.running .dial{ --dial-red:var(--red); }
  .kid-card.warn .dial{ --dial-red:var(--amber); }
  .kid-card.idle .dial{ --dial-red:#93c5fd; }
  .dial-face{
    width:64%; height:64%; border-radius:50%;
    background:#fff;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:1px;
  }
  .dial-time{
    font-weight:700; font-size:clamp(0.6rem,1.7vh,0.86rem); letter-spacing:.02em;
    font-variant-numeric:tabular-nums;
    font-family:'Gowun Dodum',sans-serif;
  }
  .dial-icon{ font-size:clamp(0.7rem,2vh,1.05rem); line-height:1; }
  .kid-card.ended .dial-face .dial-time{ display:none; }
  .kid-card.ended .dial-face .dial-icon::after{ content:'⏰'; }
  .kid-card:not(.ended) .dial-face .dial-icon.end-icon{ display:none; }
  .kid-card.exhausted .dial-face{ opacity:.55; }

  .kid-name{
    font-size:clamp(0.78rem,2vh,1.15rem);
    font-weight:700;
    text-align:center;
    line-height:1.15;
  }
  .status-text{
    font-size:clamp(0.58rem,1.3vh,0.72rem);
    color:var(--text-soft);
    line-height:1.2;
  }
  .kid-card.running .status-text{ color:var(--red); }
  .kid-card.warn .status-text{ color:var(--amber); font-weight:700; }
  .kid-card.ended .status-text{ color:var(--red); font-weight:700; }
  .kid-card.exhausted .status-text{ color:var(--text-soft); font-weight:700; }

  .action-btn{
    flex:0 0 auto;
    width:100%;
    border-radius:999px;
    padding:clamp(.3rem,.9vh,.5rem) 0;
    font-size:clamp(0.68rem,1.6vh,0.85rem);
    font-weight:700;
    cursor:pointer;
    border:2px solid transparent;
    transition:transform .1s ease, filter .15s ease;
  }
  .action-btn:active{ transform:scale(.96); }
  .action-btn.start{ background:var(--primary); color:#fff; }
  .action-btn.start:hover{ filter:brightness(1.08); }
  .action-btn.stop{ background:#fff; color:var(--red); border-color:var(--red); }
  .action-btn.stop:hover{ background:#fef2f2; }
  .action-btn.ack{ background:var(--red); color:#fff; }
  .action-btn.ack:hover{ filter:brightness(1.08); }
  .action-btn.exhausted-btn{ background:var(--track); color:var(--text-soft); cursor:default; }
  .action-btn.exhausted-btn:active{ transform:none; }

  .legend{
    flex:0 0 auto;
    max-width:1600px;
    width:100%;
    margin:0 auto;
    padding:6px clamp(16px,4vw,40px) 10px;
    display:flex;
    flex-wrap:wrap;
    gap:12px 16px;
    font-size:.78rem;
    color:var(--text-soft);
  }
  .legend span{ display:inline-flex; align-items:center; gap:6px; }
  .dot{ width:11px; height:11px; border-radius:50%; display:inline-block; }
  .dot.idle{ background:var(--track); border:1px solid var(--border); }
  .dot.running{ background:var(--red); }
  .dot.warn{ background:var(--amber); }
  .dot.done{ background:var(--red); box-shadow:0 0 0 3px rgba(239,68,68,.25); }
  .dot.exhausted{ background:var(--text-soft); }

  @media (max-width:900px){
    .board{ grid-template-columns:repeat(3, 1fr); grid-template-rows:none; grid-auto-rows:minmax(150px, 1fr); }
    .dial-wrap{ width:56px; height:56px; }
    .kid-name{ font-size:1rem; }
  }
  @media (max-width:480px){
    .board{ grid-template-columns:repeat(2, 1fr); gap:10px; }
    .dial-wrap{ width:56px; height:56px; }
  }

  .alarm-overlay{
    position:fixed; inset:0; z-index:200;
    background:rgba(15,23,42,.6);
    display:flex; align-items:center; justify-content:center;
    padding:20px;
    -webkit-app-region:no-drag;
  }
  .alarm-overlay[hidden]{ display:none; }
  .alarm-card{
    background:#fff;
    border-radius:28px;
    padding:32px 28px;
    max-width:420px;
    width:100%;
    text-align:center;
    box-shadow:0 20px 60px rgba(0,0,0,.4);
    border:4px solid var(--red);
    animation:alarmPop .35s cubic-bezier(.34,1.56,.64,1), alarmPulse 1.1s ease-in-out infinite .35s;
  }
  @keyframes alarmPop{
    0%{ transform:scale(.85); opacity:0; }
    100%{ transform:scale(1); opacity:1; }
  }
  @keyframes alarmPulse{
    0%,100%{ box-shadow:0 20px 60px rgba(0,0,0,.4), 0 0 0 0 rgba(239,68,68,.5); }
    50%{ box-shadow:0 20px 60px rgba(0,0,0,.4), 0 0 0 14px rgba(239,68,68,0); }
  }
  .alarm-icon{
    font-size:4rem;
    line-height:1;
    display:inline-block;
    animation:alarmShake 1s ease-in-out infinite;
  }
  @keyframes alarmShake{
    0%,100%{ transform:rotate(0deg); }
    20%{ transform:rotate(-12deg); }
    40%{ transform:rotate(10deg); }
    60%{ transform:rotate(-8deg); }
    80%{ transform:rotate(6deg); }
  }
  .alarm-title{
    font-family:'Gowun Batang',serif;
    font-size:1.5rem;
    color:var(--red);
    margin:10px 0 18px;
  }
  .alarm-list{
    display:flex;
    flex-direction:column;
    gap:10px;
    max-height:240px;
    overflow-y:auto;
    margin-bottom:18px;
  }
  .alarm-item{
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:#fef2f2;
    border:2px solid var(--red);
    border-radius:14px;
    padding:10px 14px;
  }
  .alarm-item-name{
    font-weight:700;
    font-size:1.1rem;
  }
  .alarm-item-btn{
    border:none;
    background:var(--red);
    color:#fff;
    font-weight:700;
    padding:.4rem 1rem;
    border-radius:999px;
    cursor:pointer;
  }
  .alarm-item-btn:hover{ filter:brightness(1.1); }
  .alarm-ack-all{
    width:100%;
    border:none;
    background:var(--primary);
    color:#fff;
    font-weight:700;
    font-size:1rem;
    padding:.7rem 0;
    border-radius:999px;
    cursor:pointer;
  }
  .alarm-ack-all:hover{ filter:brightness(1.08); }
</style>
</head>
<body>

<header class="top-bar">
  <div class="title-group">
    <h1>📱 태블릿 사용 타임아웃 게시판</h1>
    <p class="subtitle">이름을 누르면 오전/오후 각각 25분씩 시각 타이머가 시작돼요. 정지해도 사용한 시간은 그대로 남고, 자정이 지나면 자동으로 초기화됩니다.</p>
  </div>
  <div class="top-bar-right">
    <span class="today-badge" id="todayBadge"></span>
    <div class="period-toggle" id="periodToggle">
      <button class="period-btn" type="button" data-period="am">🌽 오전</button>
      <button class="period-btn" type="button" data-period="pm">🍎 오후</button>
    </div>
    <button class="icon-btn" id="pinBtn" type="button" hidden>📌 항상 위 고정</button>
    <button class="icon-btn" id="muteBtn" type="button">🔔 소리 켜짐</button>
    <button class="icon-btn" id="resetAllBtn" type="button">↺ 전체 초기화</button>
  </div>
</header>

<main class="board" id="board"></main>

<footer class="legend">
  <span><i class="dot idle"></i>대기중 · 눌러서 시작</span>
  <span><i class="dot running"></i>사용중 (25분 누적 카운트다운)</span>
  <span><i class="dot warn"></i>3분 이하 남음</span>
  <span><i class="dot done"></i>시간 종료 · 확인을 눌러주세요</span>
  <span><i class="dot exhausted"></i>오늘(오전/오후) 사용 시간 다 씀</span>
</footer>

<div class="alarm-overlay" id="alarmOverlay" hidden>
  <div class="alarm-card">
    <span class="alarm-icon">⏰</span>
    <h2 class="alarm-title">시간이 다 되었어요!</h2>
    <div class="alarm-list" id="alarmList"></div>
    <button class="alarm-ack-all" id="alarmAckAll" type="button">전체 확인</button>
  </div>
</div>

<script>
(function(){
  "use strict";

  var KIDS = [
    "강우주","권소담","김예린","남소윤","송시우","송예은","오윤정","이서환",
    "이지호","이혜연","임이든","장우진","전도준","전소영","지한겸","정아윤",
    "하소율","장다미"
  ];

  var STORAGE_KEY = "pengmam_tablet_timeout_v2";
  var MUTE_KEY = "pengmam_tablet_timeout_muted";
  var DURATION_MS = 25 * 60 * 1000;
  var WARN_MS = 3 * 60 * 1000;

  function todayStr(d){
    d = d || new Date();
    var y = d.getFullYear();
    var m = String(d.getMonth() + 1).padStart(2, "0");
    var day = String(d.getDate()).padStart(2, "0");
    return y + "-" + m + "-" + day;
  }

  function loadState(){
    var raw = null;
    try{ raw = JSON.parse(localStorage.getItem(STORAGE_KEY) || "null"); }catch(e){ raw = null; }
    var today = todayStr();
    if(!raw || raw.date !== today || typeof raw.sessions !== "object"){
      raw = { date: today, sessions: {} };
      saveState(raw);
    }
    return raw;
  }
  function saveState(s){
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(s)); }catch(e){}
  }

  var state = loadState();
  var muted = localStorage.getItem(MUTE_KEY) === "1";
  var audioCtx = null;
  var selectedPeriod = (new Date().getHours() < 12) ? "am" : "pm";
  var alarmRepeatTimer = null;

  function getAudioCtx(){
    if(!audioCtx){
      var Ctx = window.AudioContext || window.webkitAudioContext;
      if(!Ctx) return null;
      audioCtx = new Ctx();
    }
    if(audioCtx.state === "suspended"){ audioCtx.resume(); }
    return audioCtx;
  }

  function playAlarmLoud(){
    if(muted) return;
    var ctx = getAudioCtx();
    if(!ctx) return;
    try{
      var now = ctx.currentTime;
      var pattern = [880, 660, 880, 660, 1046.5];
      pattern.forEach(function(freq, i){
        var t = i * 0.25;
        var o = ctx.createOscillator();
        var g = ctx.createGain();
        o.type = "square";
        o.frequency.value = freq;
        g.gain.setValueAtTime(0.0001, now + t);
        g.gain.exponentialRampToValueAtTime(0.5, now + t + 0.03);
        g.gain.exponentialRampToValueAtTime(0.0001, now + t + 0.22);
        o.connect(g); g.connect(ctx.destination);
        o.start(now + t); o.stop(now + t + 0.24);
      });
    }catch(e){}
  }

  var koVoice = null;
  function loadVoice(){
    if(!("speechSynthesis" in window)) return;
    var vs = window.speechSynthesis.getVoices();
    koVoice = vs.find(function(v){ return v.lang && v.lang.indexOf("ko") === 0; }) || null;
  }
  if("speechSynthesis" in window){
    loadVoice();
    window.speechSynthesis.onvoiceschanged = loadVoice;
  }
  function speakName(name){
    if(muted) return;
    if(!("speechSynthesis" in window)) return;
    try{
      window.speechSynthesis.cancel();
      var u = new SpeechSynthesisUtterance(name);
      u.lang = "ko-KR"; u.rate = 0.92; u.pitch = 1.05; u.volume = 1;
      if(koVoice) u.voice = koVoice;
      window.speechSynthesis.speak(u);
    }catch(e){}
  }

  function fmt(ms){
    var totalSec = Math.max(0, Math.ceil(ms / 1000));
    var m = String(Math.floor(totalSec / 60)).padStart(2, "0");
    var s = String(totalSec % 60).padStart(2, "0");
    return m + ":" + s;
  }

  // ---- 오전/오후 별로 누적 사용시간(usedMs)을 저장하는 상태 모델 ----
  function getPeriodState(name, period){
    var s = state.sessions[name];
    if(!s) s = state.sessions[name] = {};
    var p = s[period];
    if(!p) p = s[period] = { usedMs: 0, startedAt: null, ended: false };
    return p;
  }

  // 실행 중인 타이머가 한도를 넘었으면 그 자리에서 확정(usedMs 고정)하고,
  // 그렇지 않으면 현재 남은 시간을 계산만 해서 돌려준다 (저장은 안 함).
  function evalPeriod(name, period){
    var pd = getPeriodState(name, period);
    if(pd.startedAt){
      var elapsed = Date.now() - pd.startedAt;
      var potential = pd.usedMs + elapsed;
      if(potential >= DURATION_MS){
        pd.usedMs = DURATION_MS;
        pd.startedAt = null;
        pd.ended = true;
        saveState(state);
        return { status: "ended", remaining: 0 };
      }
      var remaining = DURATION_MS - potential;
      if(remaining <= WARN_MS) return { status: "warn", remaining: remaining };
      return { status: "running", remaining: remaining };
    }
    if(pd.ended) return { status: "ended", remaining: 0 };
    var idleRemaining = DURATION_MS - pd.usedMs;
    if(idleRemaining <= 0) return { status: "exhausted", remaining: 0 };
    return { status: "idle", remaining: idleRemaining };
  }

  function startTimer(name){
    var pd = getPeriodState(name, selectedPeriod);
    if(pd.startedAt) return;
    if(DURATION_MS - pd.usedMs <= 0) return;
    getAudioCtx();
    pd.startedAt = Date.now();
    pd.ended = false;
    saveState(state);
    speakName(name);
    refreshBoard();
  }
  function stopTimer(name){
    var pd = getPeriodState(name, selectedPeriod);
    if(pd.startedAt){
      var elapsed = Date.now() - pd.startedAt;
      pd.usedMs = Math.min(DURATION_MS, pd.usedMs + elapsed);
      pd.startedAt = null;
    }
    saveState(state);
    refreshBoard();
  }
  function ackTimer(name){
    var pd = getPeriodState(name, selectedPeriod);
    pd.ended = false;
    saveState(state);
    refreshBoard();
  }

  var board = document.getElementById("board");
  var cardRefs = {};

  function buildBoard(){
    var frag = document.createDocumentFragment();
    KIDS.forEach(function(name){
      var card = document.createElement("div");
      card.className = "kid-card idle";

      var dialWrap = document.createElement("div");
      dialWrap.className = "dial-wrap";
      var dial = document.createElement("div");
      dial.className = "dial";
      dial.style.setProperty("--angle", "0deg");
      var face = document.createElement("div");
      face.className = "dial-face";
      var timeEl = document.createElement("span");
      timeEl.className = "dial-time";
      timeEl.textContent = fmt(DURATION_MS);
      var iconEl = document.createElement("span");
      iconEl.className = "dial-icon";
      iconEl.textContent = "📱";
      face.appendChild(timeEl);
      face.appendChild(iconEl);
      dial.appendChild(face);
      dialWrap.appendChild(dial);

      var nameEl = document.createElement("div");
      nameEl.className = "kid-name";
      nameEl.textContent = name;

      var statusEl = document.createElement("div");
      statusEl.className = "status-text";
      statusEl.textContent = "";

      var btn = document.createElement("button");
      btn.type = "button";
      btn.className = "action-btn start";
      btn.textContent = "▶ 시작";

      card.appendChild(dialWrap);
      card.appendChild(nameEl);
      card.appendChild(statusEl);
      card.appendChild(btn);
      frag.appendChild(card);

      cardRefs[name] = { card: card, dial: dial, timeEl: timeEl, iconEl: iconEl, statusEl: statusEl, btn: btn };
    });
    board.appendChild(frag);
  }

  function updateCard(name){
    var ref = cardRefs[name];
    var r = evalPeriod(name, selectedPeriod);
    ref.card.classList.remove("idle", "running", "warn", "ended", "exhausted");
    ref.card.classList.add(r.status);

    if(r.status === "idle"){
      ref.timeEl.textContent = fmt(r.remaining);
      ref.iconEl.textContent = "📱";
      ref.statusEl.textContent = r.remaining < DURATION_MS ? "일부 사용함" : "";
      var idleAngle = (r.remaining / DURATION_MS) * 360;
      ref.dial.style.setProperty("--angle", idleAngle.toFixed(2) + "deg");
      ref.btn.className = "action-btn start";
      ref.btn.textContent = "▶ 시작";
      ref.btn.disabled = false;
      ref.btn.onclick = function(){ startTimer(name); };
    } else if(r.status === "running" || r.status === "warn"){
      ref.timeEl.textContent = fmt(r.remaining);
      ref.iconEl.textContent = "📱";
      ref.statusEl.textContent = r.status === "warn" ? "곧 시간 종료!" : "사용중";
      var angle = (r.remaining / DURATION_MS) * 360;
      ref.dial.style.setProperty("--angle", angle.toFixed(2) + "deg");
      ref.btn.className = "action-btn stop";
      ref.btn.textContent = "■ 정지";
      ref.btn.disabled = false;
      ref.btn.onclick = function(){ stopTimer(name); };
    } else if(r.status === "exhausted"){
      ref.timeEl.textContent = "00:00";
      ref.iconEl.textContent = "📱";
      ref.statusEl.textContent = "사용 시간 다 씀";
      ref.dial.style.setProperty("--angle", "0deg");
      ref.btn.className = "action-btn exhausted-btn";
      ref.btn.textContent = "사용 완료";
      ref.btn.disabled = true;
      ref.btn.onclick = null;
    } else {
      ref.timeEl.textContent = "00:00";
      ref.iconEl.textContent = "⏰";
      ref.statusEl.textContent = "시간 종료!";
      ref.dial.style.setProperty("--angle", "0deg");
      ref.btn.className = "action-btn ack";
      ref.btn.textContent = "✔ 확인";
      ref.btn.disabled = false;
      ref.btn.onclick = function(){ ackTimer(name); };
    }
  }

  function updateAll(){
    KIDS.forEach(updateCard);
  }

  function computeEndedQueue(){
    return KIDS.filter(function(name){
      return evalPeriod(name, selectedPeriod).status === "ended";
    });
  }

  var alarmOverlay = document.getElementById("alarmOverlay");
  var alarmList = document.getElementById("alarmList");

  function renderAlarmModal(){
    var ended = computeEndedQueue();
    if(ended.length === 0){
      alarmOverlay.hidden = true;
      if(alarmRepeatTimer){ clearInterval(alarmRepeatTimer); alarmRepeatTimer = null; }
      return;
    }
    alarmOverlay.hidden = false;
    alarmList.innerHTML = "";
    ended.forEach(function(name){
      var row = document.createElement("div");
      row.className = "alarm-item";
      var nm = document.createElement("span");
      nm.className = "alarm-item-name";
      nm.textContent = name;
      var btn = document.createElement("button");
      btn.type = "button";
      btn.className = "alarm-item-btn";
      btn.textContent = "확인";
      btn.addEventListener("click", function(){ ackTimer(name); });
      row.appendChild(nm);
      row.appendChild(btn);
      alarmList.appendChild(row);
    });
    if(!alarmRepeatTimer){
      playAlarmLoud();
      alarmRepeatTimer = setInterval(playAlarmLoud, 2500);
    }
  }

  document.getElementById("alarmAckAll").addEventListener("click", function(){
    computeEndedQueue().forEach(function(name){
      getPeriodState(name, selectedPeriod).ended = false;
    });
    saveState(state);
    refreshBoard();
  });

  function refreshBoard(){
    updateAll();
    renderAlarmModal();
  }

  function checkRollover(){
    var today = todayStr();
    if(state.date !== today){
      state = { date: today, sessions: {} };
      saveState(state);
      updateTodayBadge();
    }
  }

  var todayBadge = document.getElementById("todayBadge");
  function updateTodayBadge(){
    var d = new Date();
    todayBadge.textContent = d.toLocaleDateString("ko-KR", { month: "long", day: "numeric", weekday: "long" });
  }

  var periodToggle = document.getElementById("periodToggle");
  function renderPeriodToggle(){
    var btns = periodToggle.querySelectorAll(".period-btn");
    for(var i = 0; i < btns.length; i++){
      btns[i].classList.toggle("active", btns[i].getAttribute("data-period") === selectedPeriod);
    }
  }
  periodToggle.addEventListener("click", function(e){
    var btn = e.target.closest(".period-btn");
    if(!btn) return;
    selectedPeriod = btn.getAttribute("data-period");
    renderPeriodToggle();
    refreshBoard();
  });

  var muteBtn = document.getElementById("muteBtn");
  function renderMuteBtn(){
    muteBtn.textContent = muted ? "🔕 소리 꺼짐" : "🔔 소리 켜짐";
  }
  muteBtn.addEventListener("click", function(){
    getAudioCtx();
    muted = !muted;
    localStorage.setItem(MUTE_KEY, muted ? "1" : "0");
    renderMuteBtn();
  });

  document.getElementById("resetAllBtn").addEventListener("click", function(){
    if(!confirm("모든 어린이의 오전/오후 사용 시간을 초기화할까요?")) return;
    state.sessions = {};
    saveState(state);
    refreshBoard();
  });

  // 데스크톱 앱(Electron)에서만 나타나는 "항상 위 고정" 버튼
  var pinBtn = document.getElementById("pinBtn");
  if(window.desktopAPI){
    pinBtn.hidden = false;
    var pinned = false;
    pinBtn.addEventListener("click", function(){
      pinned = !pinned;
      window.desktopAPI.setAlwaysOnTop(pinned);
      pinBtn.classList.toggle("pinned", pinned);
      pinBtn.textContent = pinned ? "📌 고정됨" : "📌 항상 위 고정";
    });
  }

  buildBoard();
  renderPeriodToggle();
  refreshBoard();
  updateTodayBadge();
  renderMuteBtn();

  setInterval(function(){
    checkRollover();
    refreshBoard();
  }, 1000);

})();
</script>

</body>
</html>
