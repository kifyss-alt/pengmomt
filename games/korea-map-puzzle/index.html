<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>우리나라 지도 퍼즐 | 펭맘 선생님의 AI미래교육 스페이스</title>
    <meta name="description" content="유아와 함께 하는 우리나라 8도 지도 맞추기 드래그 앤 드롭 퍼즐 놀이 웹앱">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="page-wrap">
        <header class="puzzle-header">
            <a href="../../index.html" class="back-link">← 펭맘 스페이스로</a>
            <div class="title-block">
                <div class="mascot-badge">🐧🗺️</div>
                <h1>우리나라 지도 퍼즐</h1>
                <p>조각을 손가락으로 콕 집어서 알맞은 자리로 옮겨 보세요!</p>
            </div>
            <div style="width: 96px;" aria-hidden="true"></div>
        </header>

        <div class="control-bar">
            <button class="ctrl-btn primary" id="resetBtn">🔄 다시 섞기</button>
            <button class="ctrl-btn" id="toggleNamesBtn">🙈 이름 숨기기</button>
            <button class="ctrl-btn" id="toggleAnswersBtn">📖 정답 보기</button>
            <div class="progress-wrap">
                <span class="progress-text" id="progressText">0 / 14 완성</span>
                <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
            </div>
            <button class="ctrl-btn icon" id="muteBtn" title="소리 켜기/끄기">🔊</button>
        </div>

        <div class="board-card">
            <div class="zone-labels">
                <span>🧩 조각 상자</span>
                <span>🗺️ 우리나라 지도</span>
            </div>
            <svg id="puzzleSvg" viewBox="0 0 1260 920" xmlns="http://www.w3.org/2000/svg" aria-label="우리나라 지도 퍼즐판">
                <g id="boardLayer"></g>
                <g id="piecesLayer"></g>
            </svg>
        </div>

        <p class="hint-banner">💡 조각을 살짝 누르면 이름을 소리 내어 읽어줘요. 정답판 위 알맞은 자리로 옮기면 딱 붙어요!</p>

        <section class="legend">
            <h2>🏷️ 우리나라 8도 이름</h2>
            <div class="legend-grid" id="legendGrid"></div>
        </section>
    </div>

    <div class="confetti-layer" id="confettiLayer"></div>

    <div class="celebrate-overlay" id="celebrateOverlay">
        <div class="celebrate-card">
            <div class="big-emoji">🎉🐧🎉</div>
            <h2>참 잘했어요!</h2>
            <p>우리나라 지도 14조각을 모두 완성했어요.</p>
            <button class="ctrl-btn primary" id="playAgainBtn">다시 놀기</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
